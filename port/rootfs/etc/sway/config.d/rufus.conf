# Rufus Cuff (included by Sxmo's sway config). The panel is 480x640 portrait and worn
# landscape with the buttons on the right, like pupui and fbcon.
output * transform 270
# wlroots turns touch by the output transform once Sxmo maps it to the output, but the DT
# already gives pupui's landscape coordinates. Hand sway panel-native ones instead:
# native (u, v) = (y, 1 - x) of the landscape (x, y).
input type:touch calibration_matrix 0 1 0 -1 0 1

# Buttons by keycode (evdev code + 8): xkb gives this power key no XF86PowerOff, so Sxmo's
# keysym bindings never fire. Sxmo's bonsai turns press/release into its button actions;
# the second button (KEY_BACK) stands in for volume-up (1 press: menu).
bindcode --locked --no-repeat --input-device="1:1:mtk-pmic-keys" 124 exec bonsaictl -e power_pressed
bindcode --locked --release --input-device="1:1:mtk-pmic-keys" 124 exec bonsaictl -e power_released
bindcode --locked --no-repeat --input-device="0:0:mt6779-keypad" 166 exec bonsaictl -e volup_pressed
bindcode --locked --release --input-device="0:0:mt6779-keypad" 166 exec bonsaictl -e volup_released

# While a menu is open sway is in Sxmo's "menu" mode: power selects, the second button moves
# down (Sxmo's keysym versions of these never fire here either).
mode "menu" {
    bindcode --input-device="1:1:mtk-pmic-keys" 124 exec wtype -k Return
    bindcode --input-device="0:0:mt6779-keypad" 166 exec wtype -k Down
}
