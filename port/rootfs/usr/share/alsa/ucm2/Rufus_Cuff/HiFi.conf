SectionVerb {
	EnableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' on"
		cset "name='ADDA_DL_CH2 DL1_CH2' on"
		cset "name='UL1_CH1 ADDA_UL_CH1' on"
		cset "name='UL1_CH2 ADDA_UL_CH2' on"
	]

	DisableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' off"
		cset "name='ADDA_DL_CH2 DL1_CH2' off"
		cset "name='UL1_CH1 ADDA_UL_CH1' off"
		cset "name='UL1_CH2 ADDA_UL_CH2' off"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Speaker Switch' on"
		cset "name='Line Out Source' Playback"
	]

	DisableSequence [
		cset "name='Line Out Source' Open"
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Lineout"
	}
}

SectionDevice."Mic" {
	Comment "Main Microphone"

	EnableSequence [
		cset "name='Main Mic Switch' on"
		cset "name='Mic Type Mux' ACC"
		cset "name='PGA L Mux' AIN0"
		cset "name='PGA R Mux' AIN0"
	]

	DisableSequence [
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
		cset "name='Mic Type Mux' Idle"
		cset "name='Main Mic Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "Mic"
	}
}
