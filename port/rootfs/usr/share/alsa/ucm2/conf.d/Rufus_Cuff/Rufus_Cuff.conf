# Rufus Cuff: MT6357 codec, speaker through a GPIO amplifier, main mic on AIN0 (from the
# AGM M7 profile; the watch has no earpiece). Volumes from the speaker/mic loop test.
Syntax 6

SectionUseCase."HiFi" {
	File "/Rufus_Cuff/HiFi.conf"
	Comment "Default"
}

BootSequence [
	cset "name='Lineout Volume' 2"
	cset "name='Mic Volume' 4"
]
